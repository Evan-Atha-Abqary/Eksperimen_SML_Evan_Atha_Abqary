name: Continuous Integration (MLflow & Docker)

on:
  push:
    paths:
      - 'Workflow-CI/MLProject/**'
  workflow_dispatch: # Memungkinkan eksekusi manual

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn mlflow==2.19.0

      - name: Run MLflow Project
        run: |
          cd Workflow-CI/MLProject
          mlflow run . --env-manager=local

      - name: Generate Dockerfile & Build Model (Plan B)
        run: |
          cd Workflow-CI/MLProject
          RUN_ID=$(cat run_id.txt | tr -d '\r\n')
          
          # 1. Minta MLflow membuatkan resep Dockerfile-nya (disimpan di folder docker_build)
          mlflow models generate-dockerfile -m "mlruns/0/$RUN_ID/artifacts/model" -d docker_build
          
          # 2. Masuk ke folder resep tersebut dan bangun Docker-nya secara manual (Sangat kebal error!)
          cd docker_build
          docker build -t evanatha/msml-model:latest .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: evanatha
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push evanatha/msml-model:latest